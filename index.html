<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK MATRIX CLOUD v4.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =================================================================
        // REEMPLAZA ESTOS DATOS CON TUS CREDENCIALES REALES DE FIREBASE
        // =================================================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://TU_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_PROJECT_ID.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Hacer las funciones accesibles globalmente para el resto del HTML
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
        window.database = db;
    </script>

    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #020208;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                linear-gradient(90deg, rgba(0, 240, 255, 0.03), rgba(255, 0, 127, 0.02), rgba(0, 240, 255, 0.03));
            background-size: 100% 6px, 6px 100%;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .neon-cyan {
            box-shadow: 0 0 30px #00f0ff, inset 0 0 15px rgba(0,240,255,0.2);
            border: 2px solid #00f0ff;
        }
        .neon-magenta {
            box-shadow: 0 0 30px #ff007f, inset 0 0 15px rgba(255,0,127,0.2);
            border: 2px solid #ff007f;
        }
        .neon-text-cyan { text-shadow: 0 0 25px #00f0ff; }
        .pulse-fast { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        mjx-container { color: white !important; font-size: inherit !important; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col justify-between p-4">

    <div id="login-screen" class="fixed inset-0 bg-[#020208] z-50 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-black/80 p-8 rounded-2xl border border-cyan-500/40 text-center shadow-2xl">
            <div class="mb-6 relative group inline-block">
                <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-pink-500 rounded blur opacity-50 group-hover:opacity-85 transition duration-1000"></div>
                <img src="logo.png" alt="Log" class="relative w-32 h-32 object-contain rounded border-2 border-cyan-400 p-2 bg-black">
            </div>
            <h1 class="cyber-font text-xl font-black text-cyan-400 tracking-widest mb-6">ACADEMIA PUENTE 4.0</h1>
            
            <div class="flex bg-zinc-900 p-1 rounded-lg border border-zinc-800 mb-6">
                <button onclick="setLoginRole('student')" id="btn-login-student" class="w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider bg-cyan-500 text-black">Estudiante</button>
                <button onclick="setLoginRole('teacher')" id="btn-login-teacher" class="w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider text-zinc-400">Docente</button>
            </div>

            <div id="form-student" class="space-y-4">
                <input type="text" id="input-student-name" placeholder="NOMBRE DEL ESTUDIANTE" class="w-full bg-zinc-950 border border-cyan-500/50 p-3 rounded text-center text-cyan-400 font-mono focus:outline-none uppercase">
                <input type="text" id="input-student-group" placeholder="GRUPO (Ej: G16, G18)" class="w-full bg-zinc-950 border border-cyan-500/50 p-3 rounded text-center text-cyan-400 font-mono focus:outline-none uppercase">
            </div>

            <div id="form-teacher" class="space-y-4 hidden">
                <input type="password" id="input-teacher-pass" placeholder="CONTRASEÑA DE ACCESO" class="w-full bg-zinc-950 border border-pink-500/50 p-3 rounded text-center text-pink-500 font-mono focus:outline-none">
                <input type="text" id="input-teacher-group" placeholder="GRUPO A GESTIONAR (Ej: G16)" class="w-full bg-zinc-950 border border-pink-500/50 p-3 rounded text-center text-pink-500 font-mono focus:outline-none uppercase">
            </div>

            <button onclick="executeLogin()" class="w-full mt-6 bg-cyan-500 hover:bg-cyan-400 text-black font-black py-3 rounded uppercase tracking-widest text-xs shadow-lg transition-all">
                Establecer Enlace Cloud_
            </button>
            <div id="login-error" class="text-pink-500 text-xs font-bold mt-3 h-4 uppercase"></div>
        </div>
    </div>

    <header class="w-full max-w-6xl mx-auto flex flex-col items-center border-b border-zinc-800 pb-4 mb-6">
        <div class="mb-4 relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-pink-500 to-cyan-500 rounded-xl blur opacity-40 shadow-[0_0_30px_rgba(0,240,255,0.3)]"></div>
            <img src="logo.png" alt="Log" class="relative w-40 h-40 object-contain rounded-xl border-2 border-cyan-500/60 bg-black/80 p-2 shadow-2xl">
        </div>
        
        <div class="w-full flex items-center justify-between text-xs font-mono px-2">
            <div class="flex items-center space-x-3">
                <span id="identity-badge" class="bg-cyan-950 text-cyan-400 px-3 py-1 rounded border border-cyan-500/40 font-bold uppercase"></span>
                <span id="session-group-badge" class="text-pink-500 font-bold"></span>
            </div>
            <button onclick="location.reload()" class="text-zinc-500 hover:text-pink-500 uppercase font-bold tracking-wider">[ Cambiar Enlace ]</button>
        </div>
    </header>

    <main id="view-student" class="w-full max-w-6xl mx-auto my-auto flex flex-col justify-between hidden">
        <div class="w-full bg-black/60 backdrop-blur-md rounded-3xl p-12 text-center neon-cyan relative min-h-[380px] flex flex-col justify-center items-center">
            <div class="absolute top-3 left-4 text-xs text-cyan-500/40 uppercase tracking-widest font-bold">Terminal_Estudiante_Render</div>
            
            <div id="student-expression" class="text-5xl md:text-7xl font-bold tracking-wide text-white font-serif py-4">
                $$\text{Esperando señal del servidor...}$$
            </div>
        </div>

        <div class="w-full max-w-2xl mx-auto mt-8 flex gap-4 items-center">
            <input type="text" id="student-answer-input" autocomplete="off" placeholder="RESPUESTA NUMÉRICA..."
                   class="w-full bg-slate-950 border-2 border-cyan-500 text-center text-cyan-300 font-mono text-3xl font-bold rounded-2xl py-5 focus:outline-none placeholder:text-cyan-950">
            <button onclick="submitStudentAnswer()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-black text-xl px-10 py-5 rounded-2xl uppercase tracking-wider transition-all">
                ENVIAR_
            </button>
        </div>
    </main>

    <main id="view-teacher" class="w-full max-w-6xl mx-auto my-auto grid md:grid-cols-3 gap-6 items-stretch hidden">
        <div class="md:col-span-1 bg-black/50 p-5 rounded-2xl border border-zinc-800 flex flex-col justify-between">
            <div>
                <h3 class="cyber-font text-xs font-bold text-pink-500 uppercase tracking-widest border-b border-zinc-800 pb-2 mb-4">Lanzador de Fórmulas TeX</h3>
                
                <div class="space-y-2 max-h-[220px] overflow-y-auto pr-1 mb-4">
                    <span class="text-[10px] text-zinc-500 block font-mono">// Plantillas LaTeX Estándar:</span>
                    <button onclick="loadPreset('3 + 4 \\cdot \\frac{8}{2} - 6')" class="w-full text-left p-2 text-xs bg-zinc-900 hover:bg-zinc-800 rounded font-mono border border-zinc-800 text-cyan-400">Combinadas: $3 + 4 \cdot \frac{8}{2} - 6$</button>
                    <button onclick="loadPreset('5 \\cdot (12 - 4) + \\frac{18}{3}')" class="w-full text-left p-2 text-xs bg-zinc-900 hover:bg-zinc-800 rounded font-mono border border-zinc-800 text-cyan-400">Agrupación: $5 \cdot (12 - 4) + \frac{18}{3}$</button>
                    <button onclick="loadPreset('\\Delta_s = \\begin{vmatrix} 2 & 5 \\\\ -4 & 3 \\end{vmatrix}')" class="w-full text-left p-2 text-xs bg-zinc-900 hover:bg-zinc-800 rounded font-mono border border-zinc-800 text-cyan-400">Determinantes: $\Delta_s$</button>
                </div>

                <div class="space-y-2">
                    <label class="block text-[11px] text-pink-400 uppercase font-bold">Ecuación en formato LaTeX / Texto:</label>
                    <textarea id="teacher-custom-op" rows="3" placeholder="Ej: \frac{x}{2} + 4 = 10" class="w-full bg-zinc-950 border border-pink-500/40 p-3 rounded font-mono text-sm text-zinc-100 focus:outline-none"></textarea>
                    <button onclick="broadcastOperation()" class="w-full bg-pink-500 hover:bg-pink-400 text-black font-black py-2.5 rounded text-xs uppercase tracking-widest transition-all">PROYECTAR CLOUD_</button>
                </div>
            </div>
            <button onclick="clearCloudAnswers()" class="mt-4 border border-red-500/30 text-red-400 bg-red-950/20 py-2 rounded text-xs uppercase font-mono hover:bg-red-950/50">Limpiar Respuestas de Red</button>
        </div>

        <div class="md:col-span-2 bg-slate-950/70 p-6 rounded-2xl neon-magenta flex flex-col justify-between relative min-h-[400px]">
            <div class="absolute top-2 left-4 text-xs text-pink-500/50 font-bold uppercase tracking-widest">Respuestas_En_Línea_Grupo</div>
            <div id="responses-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6 my-auto pt-4 max-h-[340px] overflow-y-auto"></div>
        </div>
    </main>

    <footer class="w-full text-center text-[9px] text-zinc-700 font-mono uppercase tracking-widest mt-6">FIREBASE REALTIME DATALINK // 2026</footer>

    <script>
        let selectedRole = 'student';
        let sessionUser = '';
        let sessionGroup = '';
        let startTime = null;

        function setLoginRole(role) {
            selectedRole = role;
            document.getElementById("btn-login-student").className = role === 'student' ? "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider bg-cyan-500 text-black" : "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider text-zinc-400";
            document.getElementById("btn-login-teacher").className = role === 'teacher' ? "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider bg-pink-500 text-black" : "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider text-zinc-400";
            
            if (role === 'student') {
                document.getElementById("form-student").classList.remove("hidden");
                document.getElementById("form-teacher").classList.add("hidden");
            } else {
                document.getElementById("form-student").classList.add("hidden");
                document.getElementById("form-teacher").classList.remove("hidden");
            }
        }

        function executeLogin() {
            if (selectedRole === 'student') {
                const name = document.getElementById("input-student-name").value.trim().toUpperCase();
                const group = document.getElementById("input-student-group").value.trim().toUpperCase();
                if (!name || !group) {
                    document.getElementById("login-error").innerText = "FALTAN DATOS DE ENLACE";
                    return;
                }
                sessionUser = name;
                sessionGroup = group;
                setupStudentView();
            } else {
                const pass = document.getElementById("input-teacher-pass").value;
                const group = document.getElementById("input-teacher-group").value.trim().toUpperCase();
                if (pass !== 'admin123' || !group) {
                    document.getElementById("login-error").innerText = "CREDENCIALES O GRUPO INVÁLIDOS";
                    return;
                }
                sessionUser = 'PROFESOR';
                sessionGroup = group;
                setupTeacherView();
            }
            document.getElementById("login-screen").classList.add("hidden");
        }

        // --- SISTEMA ESTUDIANTE (CONEXIÓN CLOUD) ---
        function setupStudentView() {
            document.getElementById("identity-badge").innerText = sessionUser;
            document.getElementById("session-group-badge").innerText = `[ GRUPO: ${sessionGroup} ]`;
            document.getElementById("view-student").classList.remove("hidden");

            const opRef = window.dbRef(window.database, `groups/${sessionGroup}/active_op`);
            window.dbOnValue(opRef, (snapshot) => {
                const data = snapshot.val() || "\\text{Esperando operación...}";
                const container = document.getElementById("student-expression");
                
                container.innerHTML = `$$ ${data} $$`;
                startTime = new Date();
                
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                }
            });
        }

        function submitStudentAnswer() {
            const ans = document.getElementById("student-answer-input").value.trim();
            if(!ans) return;

            const elapsed = startTime ? Math.round((new Date() - startTime) / 1000) : 0;
            const answerRef = window.dbRef(window.database, `groups/${sessionGroup}/answers/${sessionUser}`);
            
            window.dbSet(answerRef, {
                student: sessionUser,
                answer: ans,
                time: `${elapsed}s`
            });

            document.getElementById("student-answer-input").value = "";
        }

        // --- SISTEMA PROFESOR (CONSOLA BROADCAST) ---
        function setupTeacherView() {
            document.getElementById("identity-badge").innerText = "CONSOLA GENERAL DOCENTE";
            document.getElementById("session-group-badge").innerText = `[ GRUPO: ${sessionGroup} ]`;
            document.getElementById("view-teacher").classList.remove("hidden");

            const answersRef = window.dbRef(window.database, `groups/${sessionGroup}/answers`);
            window.dbOnValue(answersRef, (snapshot) => {
                const grid = document.getElementById("responses-grid");
                grid.innerHTML = "";
                const data = snapshot.val();

                if(data) {
                    Object.keys(data).forEach(studentKey => {
                        const res = data[studentKey];
                        const circle = document.createElement("div");
                        circle.className = "flex flex-col items-center justify-center text-center p-2";
                        circle.innerHTML = `
                            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-pink-600 to-amber-500 flex flex-col items-center justify-center border-2 border-yellow-300 shadow-[0_0_15px_rgba(255,251,0,0.5)]">
                                <span class="text-xs text-black font-black uppercase tracking-tight max-w-[80px] truncate">${res.student}</span>
                                <span class="text-lg text-white font-black cyber-font tracking-tighter mt-0.5">${res.answer}</span>
                                <span class="text-[9px] bg-black/40 px-1.5 py-0.5 rounded-full text-yellow-300 font-bold mt-1">${res.time}</span>
                            </div>
                        `;
                        grid.appendChild(circle);
                    });
                } else {
                    grid.innerHTML = `<div class='col-span-full text-center text-zinc-600 font-mono text-xs py-12 pulse-fast'>[ Canal en línea limpio. Esperando respuestas en ${sessionGroup}... ]</div>`;
                }
            });
        }

        function loadPreset(latexStr) {
            document.getElementById("teacher-custom-op").value = latexStr;
        }

        function broadcastOperation() {
            const op = document.getElementById("teacher-custom-op").value.trim();
            if(!op) return;
            
            const opRef = window.dbRef(window.database, `groups/${sessionGroup}/active_op`);
            window.dbSet(opRef, op);
            clearCloudAnswers();
        }

        function clearCloudAnswers() {
            const answersRef = window.dbRef(window.database, `groups/${sessionGroup}/answers`);
            window.dbRemove(answersRef);
        }
    </script>
</body>
</html>
