<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ACADEMIA PUENTE v4.2 ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpYhQI_6JW2xXTR3jU0JDD-bNX_-SG_3Q",
            authDomain: "pulsadoraula.firebaseapp.com",
            databaseURL: "https://pulsadoraula-default-rtdb.firebaseio.com",
            projectId: "pulsadoraula",
            storageBucket: "pulsadoraula.firebasestorage.app",
            messagingSenderId: "264276501069",
            appId: "1:264276501069:web:9286be98f4f9540052f204"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Exportar al entorno global de la ventana para interoperabilidad
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
        window.database = db;
    </script>

    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #020208;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                linear-gradient(90deg, rgba(0, 240, 255, 0.03), rgba(255, 0, 127, 0.02), rgba(0, 240, 255, 0.03));
            background-size: 100% 6px, 6px 100%;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        
        .neon-cyan {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(0,240,255,0.15);
            border: 2px solid #00f0ff;
        }
        .neon-magenta {
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255,0,127,0.15);
            border: 2px solid #ff007f;
        }
        .neon-text-cyan { text-shadow: 0 0 15px #00f0ff; }
        .pulse-fast { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* Ajuste para que MathJax se adapte al contenedor Cyberpunk */
        mjx-container { color: white !important; font-size: inherit !important; display: inline-block !important; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col justify-between p-4">

    <div id="login-screen" class="fixed inset-0 bg-[#020208] z-50 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-black/90 p-8 rounded-2xl border border-cyan-500/40 text-center shadow-2xl">
            <h1 class="cyber-font text-2xl font-black text-cyan-400 tracking-widest mb-2">ACADEMIA_PUENTE_v4.2</h1>
            <p class="text-zinc-500 text-xs font-mono tracking-wider mb-6">// ACADEMIA PUENTE ROUTER</p>
            
            <div class="flex bg-zinc-900 p-1 rounded-lg border border-zinc-800 mb-6">
                <button onclick="setLoginRole('student')" id="btn-login-student" class="w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider bg-cyan-500 text-black transition-all">Estudiante</button>
                <button onclick="setLoginRole('teacher')" id="btn-login-teacher" class="w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider text-zinc-400 transition-all">Docente</button>
            </div>

            <div id="form-student" class="space-y-4">
                <input type="text" id="input-student-name" placeholder="NOMBRE DEL ESTUDIANTE" class="w-full bg-zinc-950 border border-cyan-500/50 p-3 rounded text-center text-cyan-400 font-mono focus:outline-none uppercase tracking-wide">
                <input type="text" id="input-student-group" placeholder="GRUPO DE ACCESO" value="G16" class="w-full bg-zinc-950 border border-cyan-500/50 p-3 rounded text-center text-cyan-400 font-mono focus:outline-none uppercase tracking-wide">
            </div>

            <div id="form-teacher" class="space-y-4 hidden">
                <input type="password" id="input-teacher-pass" placeholder="CONTRASEÑA MAESTRA" class="w-full bg-zinc-950 border border-pink-500/50 p-3 rounded text-center text-pink-500 font-mono focus:outline-none tracking-widest">
                <input type="text" id="input-teacher-group" placeholder="GRUPO A GESTIONAR" value="G16" class="w-full bg-zinc-950 border border-pink-500/50 p-3 rounded text-center text-pink-500 font-mono focus:outline-none uppercase tracking-wide">
            </div>

            <button onclick="executeLogin()" class="w-full mt-6 bg-cyan-500 hover:bg-cyan-400 text-black font-black py-3 rounded uppercase tracking-widest text-xs shadow-lg transition-all">
                Establecer Enlace Cloud_
            </button>
            <div id="login-error" class="text-pink-500 text-xs font-bold mt-3 h-4 uppercase tracking-wide"></div>
        </div>
    </div>

    <header class="w-full max-w-6xl mx-auto flex items-center justify-between border-b border-zinc-800 pb-3 mb-4 text-xs font-mono">
        <div class="flex items-center space-x-3">
            <span id="identity-badge" class="bg-cyan-950 text-cyan-400 px-3 py-1 rounded border border-cyan-500/40 font-bold uppercase tracking-wider"></span>
            <span id="session-group-badge" class="text-pink-500 font-bold tracking-widest"></span>
        </div>
        <button onclick="location.reload()" class="text-zinc-500 hover:text-pink-500 uppercase font-bold tracking-widest transition-colors">[ DESCONECTAR ]</button>
    </header>

    <main id="view-student" class="w-full max-w-6xl mx-auto my-auto flex flex-col justify-between hidden px-2">
        <div class="w-full bg-black/70 backdrop-blur-md rounded-3xl p-6 md:p-12 text-center neon-cyan relative min-h-[280px] md:min-h-[380px] flex flex-col justify-center items-center">
            <div class="absolute top-3 left-4 text-[10px] text-cyan-500/50 uppercase tracking-widest font-bold font-mono">Terminal_Estudiante_Render // RX</div>
            
            <div id="student-expression" class="text-4xl md:text-6xl font-bold tracking-wide text-white font-serif py-4 w-full overflow-x-auto">
                $$\text{Esperando señal del servidor...}$$
            </div>
        </div>

        <div class="w-full max-w-2xl mx-auto mt-8 flex flex-col sm:flex-row gap-4 items-center">
            <input type="text" id="student-answer-input" autocomplete="off" placeholder="RESPUESTA NUMÉRICA..."
                   class="w-full bg-slate-950 border-2 border-cyan-500 text-center text-cyan-300 font-mono text-3xl font-bold rounded-2xl py-4 focus:outline-none placeholder:text-cyan-950 shadow-[0_0_15px_rgba(0,240,255,0.1)]">
            <button id="btn-submit-answer" onclick="submitStudentAnswer()" class="w-full sm:w-auto bg-cyan-500 hover:bg-cyan-400 text-black font-black text-xl px-10 py-4 rounded-2xl uppercase tracking-wider transition-all shadow-lg whitespace-nowrap">
                ENVIAR_
            </button>
        </div>
    </main>

    <main id="view-teacher" class="w-full max-w-6xl mx-auto my-auto grid md:grid-cols-3 gap-6 items-stretch hidden px-2">
        <div class="md:col-span-1 bg-black/60 p-5 rounded-2xl border border-zinc-800 flex flex-col justify-between shadow-xl">
            <div>
                <h3 class="cyber-font text-xs font-bold text-pink-500 uppercase tracking-widest border-b border-zinc-800 pb-2 mb-4">// Lanzador de Fórmulas TeX</h3>
                
                <div class="space-y-2 max-h-[200px] overflow-y-auto pr-1 mb-4">
                    <span class="text-[10px] text-zinc-500 block font-mono">// Plantillas Integradas:</span>
                    <button onclick="loadPreset('5 + 3 \\times 2 - 8 \\div 4')" class="w-full text-left p-2 text-xs bg-zinc-900 hover:bg-zinc-800 rounded font-mono border border-zinc-800 text-cyan-400 truncate">Jerarquía: $5 + 3 \times 2 - 8 \div 4$</button>
                    <button onclick="loadPreset('4 \\times (3 + 2)^2 - 10')" class="w-full text-left p-2 text-xs bg-zinc-900 hover:bg-zinc-800 rounded font-mono border border-zinc-800 text-cyan-400 truncate">Potencia: $4 \times (3 + 2)^2 - 10$</button>
                    <button onclick="loadPreset('\\text{MCD}(24, 36)')" class="w-full text-left p-2 text-xs bg-zinc-900 hover:bg-zinc-800 rounded font-mono border border-zinc-800 text-cyan-400 truncate">Máximo Común Divisor: $\text{MCD}$</button>
                </div>

                <div class="space-y-2">
                    <label class="block text-[11px] text-pink-400 uppercase font-bold tracking-wide">Ecuación / Desafío en Pantalla:</label>
                    <textarea id="teacher-custom-op" rows="3" placeholder="Ej: 5 + 3 \times 2" class="w-full bg-zinc-950 border border-pink-500/40 p-3 rounded font-mono text-sm text-zinc-100 focus:outline-none focus:border-pink-500 transition-colors"></textarea>
                    <button onclick="broadcastOperation()" class="w-full bg-pink-500 hover:bg-pink-400 text-black font-black py-3 rounded text-xs uppercase tracking-widest transition-all shadow-md">PROYECTAR EN LA RED_</button>
                </div>
            </div>
            <button onclick="clearCloudAnswers()" class="mt-4 border border-red-500/40 text-red-400 bg-red-950/20 py-2 rounded text-xs uppercase font-mono hover:bg-red-950/40 transition-colors">Limpiar Respuestas de Red</button>
        </div>

        <div class="md:col-span-2 bg-slate-950/60 p-6 rounded-2xl neon-magenta flex flex-col justify-between relative min-h-[380px] shadow-xl">
            <div class="absolute top-2 left-4 text-[10px] text-pink-500/60 font-bold uppercase tracking-widest font-mono">Respuestas_En_Línea_Grupo // TX</div>
            <div id="responses-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6 my-auto pt-6 max-h-[340px] overflow-y-auto"></div>
        </div>
    </main>

    <footer class="w-full text-center text-[9px] text-zinc-700 font-mono uppercase tracking-widest mt-6">FIREBASE REALTIME DATALINK // SECURE_CLOUD_ROUTER</footer>

    <script>
        let selectedRole = 'student';
        let sessionUser = '';
        let sessionGroup = '';
        let startTime = null;

        function setLoginRole(role) {
            selectedRole = role;
            document.getElementById("btn-login-student").className = role === 'student' ? "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider bg-cyan-500 text-black transition-all" : "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider text-zinc-400 transition-all";
            document.getElementById("btn-login-teacher").className = role === 'teacher' ? "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider bg-pink-500 text-black transition-all" : "w-1/2 py-2 text-xs rounded font-bold uppercase tracking-wider text-zinc-400 transition-all";
            
            if (role === 'student') {
                document.getElementById("form-student").classList.remove("hidden");
                document.getElementById("form-teacher").classList.add("hidden");
            } else {
                document.getElementById("form-student").classList.add("hidden");
                document.getElementById("form-teacher").classList.remove("hidden");
            }
        }

        function executeLogin() {
            if (selectedRole === 'student') {
                const name = document.getElementById("input-student-name").value.trim().toUpperCase().replace(/[^A-Z0-9_ ]/g, "");
                const group = document.getElementById("input-student-group").value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, "");
                if (!name || !group) {
                    document.getElementById("login-error").innerText = "FALTAN DATOS DE ENLACE";
                    return;
                }
                sessionUser = name;
                sessionGroup = group;
                setupStudentView();
            } else {
                const pass = document.getElementById("input-teacher-pass").value;
                const group = document.getElementById("input-teacher-group").value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, "");
                // Aplicada la contraseña de control asignada: 'mejia'
                if (pass !== 'mejia' || !group) {
                    document.getElementById("login-error").innerText = "CREDENCIALES O GRUPO INVÁLIDOS";
                    return;
                }
                sessionUser = 'PROFESOR_CENTRAL';
                sessionGroup = group;
                setupTeacherView();
            }
            document.getElementById("login-screen").classList.add("hidden");
        }

        // --- SISTEMA ESTUDIANTE (CONEXIÓN CLOUD) ---
        function setupStudentView() {
            document.getElementById("identity-badge").innerText = sessionUser;
            document.getElementById("session-group-badge").innerText = `[ CANAL: ${sessionGroup} ]`;
            document.getElementById("view-student").classList.remove("hidden");

            const opRef = window.dbRef(window.database, `groups/${sessionGroup}/active_op`);
            window.dbOnValue(opRef, (snapshot) => {
                const data = snapshot.val() || "\\text{Esperando operación...}";
                const container = document.getElementById("student-expression");
                
                container.innerHTML = `$$ ${data} $$`;
                startTime = new Date();
                
                // Habilitar botón de envío de nuevo al recibir reto fresco
                const submitBtn = document.getElementById("btn-submit-answer");
                submitBtn.disabled = false;
                submitBtn.innerText = "ENVIAR_";
                submitBtn.classList.remove("opacity-40", "cursor-not-allowed");

                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                }
            });
        }

        function submitStudentAnswer() {
            const inputField = document.getElementById("student-answer-input");
            const submitBtn = document.getElementById("btn-submit-answer");
            const ans = inputField.value.trim();
            if(!ans) return;

            // Bloqueo temporal anti-duplicados instantáneos
            submitBtn.disabled = true;
            submitBtn.innerText = "ENVIADO✓";
            submitBtn.classList.add("opacity-40", "cursor-not-allowed");

            const elapsed = startTime ? Math.round((new Date() - startTime) / 1000) : 0;
            const answerRef = window.dbRef(window.database, `groups/${sessionGroup}/answers/${sessionUser}`);
            
            window.dbSet(answerRef, {
                student: sessionUser,
                answer: ans,
                time: `${elapsed}s`
            });

            inputField.value = "";
        }

        // --- SISTEMA PROFESOR (CONSOLA BROADCAST) ---
        function setupTeacherView() {
            document.getElementById("identity-badge").innerText = "CONSOLA DOCENTE OPERACIONES";
            document.getElementById("session-group-badge").innerText = `[ PANEL: ${sessionGroup} ]`;
            document.getElementById("view-teacher").classList.remove("hidden");

            const answersRef = window.dbRef(window.database, `groups/${sessionGroup}/answers`);
            window.dbOnValue(answersRef, (snapshot) => {
                const grid = document.getElementById("responses-grid");
                grid.innerHTML = "";
                const data = snapshot.val();

                if(data) {
                    Object.keys(data).forEach(studentKey => {
                        const res = data[studentKey];
                        const displayNode = document.createElement("div");
                        displayNode.className = "flex flex-col items-center justify-center text-center p-1";
                        displayNode.innerHTML = `
                            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-pink-600 via-purple-900 to-cyan-700 flex flex-col items-center justify-center border-2 border-cyan-400 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                                <span class="text-[10px] text-zinc-300 font-bold uppercase tracking-tight max-w-[80px] truncate px-1">${res.student}</span>
                                <span class="text-xl text-white font-black cyber-font tracking-tighter mt-0.5">${res.answer}</span>
                                <span class="text-[9px] bg-black/50 px-2 py-0.5 rounded-full text-yellow-400 font-bold mt-1">${res.time}</span>
                            </div>
                        `;
                        grid.appendChild(displayNode);
                    });
                } else {
                    grid.innerHTML = `<div class='col-span-full text-center text-zinc-600 font-mono text-xs py-12 pulse-fast'>[ Canal limpio. Esperando terminales en ${sessionGroup}... ]</div>`;
                }
            });
        }

        function loadPreset(latexStr) {
            document.getElementById("teacher-custom-op").value = latexStr;
        }

        function broadcastOperation() {
            const op = document.getElementById("teacher-custom-op").value.trim();
            if(!op) return;
            
            const opRef = window.dbRef(window.database, `groups/${sessionGroup}/active_op`);
            window.dbSet(opRef, op);
            clearCloudAnswers(); 
        }

        function clearCloudAnswers() {
            const answersRef = window.dbRef(window.database, `groups/${sessionGroup}/answers`);
            window.dbRemove(answersRef);
        }
    </script>
</body>
</html>
